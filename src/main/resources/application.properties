spring.application.name=cart-rush
spring.datasource.url=jdbc:mysql://localhost:3306/cart_rush
spring.datasource.username=cart_rush_app
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Shopping assistant. Supply GEMINI_API_KEY as an environment variable.
app.assistant.provider=${APP_ASSISTANT_PROVIDER:gemini}
app.assistant.gemini-model=${APP_ASSISTANT_GEMINI_MODEL:gemini-3.8-flash}
app.assistant.gemini-api-key=${GEMINI_API_KEY:}
app.assistant.connect-timeout=3s
app.assistant.read-timeout=45s

# Set to true ONCE to fill the dashboard charts with ~90 days of demo orders, then set back to false
app.seed-demo-data=false
